name: Compatibility Modules

on:
  pull_request:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - '**/*.go'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-compatibility:
    name: resolve-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      common_sha: ${{ steps.resolver.outputs.common_sha }}
      agent_sha: ${{ steps.resolver.outputs.agent_sha }}
      backend_sha: ${{ steps.resolver.outputs.backend_sha }}
    steps:
      - name: Check out common repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out base manifest from opsnexus-docs main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OpsNexusHQ/opsnexus-docs
          ref: main
          path: ci-source/opsnexus-docs
          persist-credentials: false

      - name: Resolve compatibility set
        id: resolver
        shell: bash
        run: |
          set -euo pipefail
          pr_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          python3 ci-source/opsnexus-docs/scripts/resolve_compatibility_set.py \
            --manifest ci-source/opsnexus-docs/engineering/releases/platform-compatibility.yaml \
            --pr-repo opsnexus-common \
            --pr-sha "$pr_sha" \
            --github-output "$GITHUB_OUTPUT"

  compatibility-modules:
    name: ci/compatibility-modules
    needs: resolve-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out common at PR HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out agent baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OpsNexusHQ/opsnexus-agent
          ref: ${{ needs.resolve-compatibility.outputs.agent_sha }}
          path: ci-consumers/opsnexus-agent
          persist-credentials: false

      - name: Check out backend baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OpsNexusHQ/opsnexus-backend
          ref: ${{ needs.resolve-compatibility.outputs.backend_sha }}
          path: ci-consumers/opsnexus-backend
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Validate module strategy for consumers
        run: |
          set -euo pipefail
          for consumer in opsnexus-agent opsnexus-backend; do
            echo "ci/compatibility-modules: validating $consumer requirement"
            grep -Eq '^require github.com/OpsNexusHQ/opsnexus-common v' "ci-consumers/$consumer/go.mod"
            ! grep -Eq '^replace .*opsnexus-common.*=>[[:space:]]*\.\.' "ci-consumers/$consumer/go.mod"
          done

      - name: Validate common module compilation and tests
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          go list -m all
          go mod verify
          go test ./...
